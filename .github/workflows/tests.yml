name: Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build production target
        run: swift build -c debug --product SwitchBlade

      - name: Run tests
        # SwitchBladeTests is a custom in-process runner that exits non-zero on
        # failure; no XCTest / swift-testing harness needed.
        # SWIFT_DETERMINISTIC_HASHING removes per-process Hasher seed
        # randomness so the synthetic-ID collision sweep is reproducible.
        env:
          SWIFT_DETERMINISTIC_HASHING: "1"
        run: swift run SwitchBladeTests
